networks:
  ecommerce-platform:
    driver: bridge

volumes:
  postgres-user-data:
  postgres-catalog-data:
  postgres-cart-data:
  postgres-order-data:
  postgres-payment-data:
  postgres-notification-data:
  kafka-data:
  redis-data:

services:
  # ---------------------------------------------------------------------
  # PostgreSQL — one instance per service (database-per-service pattern).
  # Six separate containers, not one instance with six logical DBs, so
  # each service has its own credentials and failure domain, mirroring how
  # this would be deployed later (separate managed DB instances in prod).
  # ---------------------------------------------------------------------
  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user
    restart: unless-stopped
    environment:
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: user_service_dev_password
      POSTGRES_DB: user_service_db
    ports:
      - '5432:5432'
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user_service -d user_service_db']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-platform

  postgres-catalog:
    image: postgres:16-alpine
    container_name: postgres-catalog
    restart: unless-stopped
    environment:
      POSTGRES_USER: catalog_service
      POSTGRES_PASSWORD: catalog_service_dev_password
      POSTGRES_DB: catalog_service_db
    ports:
      - '5433:5432'
    volumes:
      - postgres-catalog-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U catalog_service -d catalog_service_db']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-platform

  postgres-cart:
    image: postgres:16-alpine
    container_name: postgres-cart
    restart: unless-stopped
    environment:
      POSTGRES_USER: cart_service
      POSTGRES_PASSWORD: cart_service_dev_password
      POSTGRES_DB: cart_service_db
    ports:
      - '5434:5432'
    volumes:
      - postgres-cart-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cart_service -d cart_service_db']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-platform

  postgres-order:
    image: postgres:16-alpine
    container_name: postgres-order
    restart: unless-stopped
    environment:
      POSTGRES_USER: order_service
      POSTGRES_PASSWORD: order_service_dev_password
      POSTGRES_DB: order_service_db
    ports:
      - '5435:5432'
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U order_service -d order_service_db']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-platform

  postgres-payment:
    image: postgres:16-alpine
    container_name: postgres-payment
    restart: unless-stopped
    environment:
      POSTGRES_USER: payment_service
      POSTGRES_PASSWORD: payment_service_dev_password
      POSTGRES_DB: payment_service_db
    ports:
      - '5436:5432'
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payment_service -d payment_service_db']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-platform

  postgres-notification:
    image: postgres:16-alpine
    container_name: postgres-notification
    restart: unless-stopped
    environment:
      POSTGRES_USER: notification_service
      POSTGRES_PASSWORD: notification_service_dev_password
      POSTGRES_DB: notification_service_db
    ports:
      - '5437:5432'
    volumes:
      - postgres-notification-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U notification_service -d notification_service_db']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-platform

  # ---------------------------------------------------------------------
  # Kafka — single-node KRaft mode (no separate Zookeeper container).
  # Sufficient for local dev/demo purposes; a real deployment would run a
  # multi-broker cluster, which is out of scope for this project's target.
  # ---------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      CLUSTER_ID: 'ZWNvbW1lcmNlLXBsYXRmb3JtLQ=='
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9092 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ecommerce-platform

  # ---------------------------------------------------------------------
  # Redis — shared instance: JWT refresh-token blocklist, idempotency
  # keys (Payment Service, later stages), and general caching.
  # ---------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: redis-server --requirepass redis_dev_password
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redis_dev_password', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ecommerce-platform
